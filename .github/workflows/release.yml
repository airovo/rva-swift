name: Release

# Packages the Swift adapter against a published core binary.
#
# The Rust core (RVAFFI.xcframework) is built and hosted by airovo/rva releases.
# This workflow pins Package.swift to a chosen core tag, recomputes the SwiftPM
# checksum, commits to main and tags a new Swift package version. It needs neither
# Rust nor Xcode (the SwiftPM binary checksum is the archive's SHA-256).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New Swift package version, e.g. 0.1.0 (semver, no leading v)"
        required: true
      core_tag:
        description: "Core release tag in airovo/rva, e.g. v0.1.2"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Pin core & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Download the core binary
        env:
          CORE_TAG: ${{ inputs.core_tag }}
        run: |
          url="https://github.com/airovo/rva/releases/download/${CORE_TAG}/RVAFFI.xcframework.zip"
          curl -fSL "$url" -o RVAFFI.xcframework.zip
      - name: Pin Package.swift and compute the checksum
        env:
          CORE_TAG: ${{ inputs.core_tag }}
        run: |
          url="https://github.com/airovo/rva/releases/download/${CORE_TAG}/RVAFFI.xcframework.zip"
          checksum="$(sha256sum RVAFFI.xcframework.zip | awk '{print $1}')"
          echo "SwiftPM checksum: $checksum"
          python3 - "$url" "$checksum" <<'PY'
          import pathlib, re, sys
          url, checksum = sys.argv[1], sys.argv[2]
          p = pathlib.Path("Package.swift")
          s = p.read_text()
          s = re.sub(r'^let rvaFFIUrl = .*$', f'let rvaFFIUrl = "{url}"', s, count=1, flags=re.M)
          s = re.sub(r'^let rvaFFIChecksum = .*$', f'let rvaFFIChecksum = "{checksum}"', s, count=1, flags=re.M)
          p.write_text(s)
          PY
          git diff -- Package.swift
      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
          CORE_TAG: ${{ inputs.core_tag }}
        run: |
          tag="$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"; exit 1
          fi
          git add Package.swift
          git commit -m "release: $tag (core $CORE_TAG)"
          git tag "$tag"
          git push origin "HEAD:main"
          git push origin "$tag"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CORE_TAG: ${{ inputs.core_tag }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Swift package pinning RVAFFI.xcframework from airovo/rva \`$CORE_TAG\`."
